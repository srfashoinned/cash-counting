<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rupaya — Note Counter</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0f;
  --surface: #16161a;
  --surface2: #1e1e24;
  --border: #2a2a35;
  --gold: #f0b429;
  --gold2: #ffd166;
  --green: #06d6a0;
  --blue: #118ab2;
  --pink: #ff6b9d;
  --text: #f0ede8;
  --muted: #888;
  --r100: #4CAF50;
  --r200: #2196F3;
  --r500: #FF9800;
  --r50: #9C27B0;
  --r20: #F44336;
  --r10: #00BCD4;
  --r2: #E91E63;
  --r1: #795548;
  --note-h: 52px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* === BACKGROUND PARTICLES === */
#bg-canvas {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0; opacity: 0.4;
}

/* === HEADER === */
header {
  position: relative; z-index: 10;
  padding: 2rem 2rem 1rem;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 2rem;
  letter-spacing: -0.03em;
}
.logo span { color: var(--gold); }
.logo-sub {
  font-size: 0.75rem;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-top: 2px;
}
.header-total {
  text-align: right;
}
.header-total-label {
  font-size: 0.7rem;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.header-total-value {
  font-family: 'Syne', sans-serif;
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--gold);
  transition: all 0.3s;
}

/* === MAIN LAYOUT === */
main {
  position: relative; z-index: 10;
  max-width: 900px; margin: 0 auto;
  padding: 2rem;
}

/* === NOTE ROWS (Primary 3) === */
.primary-notes {
  display: flex; flex-direction: column; gap: 1rem;
  margin-bottom: 2rem;
}

.note-row {
  display: flex; align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1rem 1.5rem;
  gap: 1.5rem;
  transition: border-color 0.2s, transform 0.1s;
  cursor: default;
}
.note-row:hover { border-color: #444; transform: translateY(-1px); }
.note-row.active { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold)33; }

.note-chip {
  width: 72px; height: 40px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Syne', sans-serif;
  font-weight: 800; font-size: 1.1rem;
  flex-shrink: 0;
  position: relative; overflow: hidden;
}
.note-chip::after {
  content: '₹'; position: absolute; right: 4px; top: 2px;
  font-size: 0.6rem; opacity: 0.5;
}
.chip-100 { background: linear-gradient(135deg, #1a4a1e, #2d7a33); color: #7fff88; border: 1px solid #2d7a33; }
.chip-200 { background: linear-gradient(135deg, #1a2e4a, #1e5588); color: #7fbfff; border: 1px solid #1e5588; }
.chip-500 { background: linear-gradient(135deg, #4a2a1a, #884422); color: #ffb87f; border: 1px solid #884422; }
.chip-50 { background: linear-gradient(135deg, #3a1a4a, #6b2e8a); color: #df9fff; border: 1px solid #6b2e8a; }
.chip-20 { background: linear-gradient(135deg, #4a1a1a, #882222); color: #ff9f9f; border: 1px solid #882222; }
.chip-10 { background: linear-gradient(135deg, #1a3d4a, #1e7788); color: #7fefff; border: 1px solid #1e7788; }
.chip-2 { background: linear-gradient(135deg, #4a1a3a, #882268); color: #ff9fdf; border: 1px solid #882268; }
.chip-1 { background: linear-gradient(135deg, #2e1a0a, #5a3212); color: #ffd7a0; border: 1px solid #5a3212; }

.note-label {
  flex: 1;
  font-family: 'DM Mono', monospace;
  font-size: 0.8rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.note-label strong {
  display: block;
  font-family: 'Syne', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0;
  margin-bottom: 2px;
}

.note-input-wrap {
  position: relative;
  display: flex; align-items: center;
}
.note-input {
  width: 90px; height: 44px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 1.1rem;
  font-weight: 500;
  text-align: center;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  -moz-appearance: textfield;
}
.note-input::-webkit-inner-spin-button,
.note-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.note-input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px var(--gold)22;
}
.note-input::placeholder { color: #444; }

.note-multiplier {
  font-family: 'DM Mono', monospace;
  font-size: 0.85rem;
  color: var(--muted);
  padding: 0 0.5rem;
}

.note-value {
  min-width: 110px;
  text-align: right;
  font-family: 'Syne', sans-serif;
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--gold);
  transition: all 0.2s;
}
.note-value.zero { color: #444; font-weight: 400; font-size: 1rem; }

/* === DENOMINATION TOGGLES === */
.denom-section {
  margin-bottom: 2rem;
}
.denom-header {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
  margin-bottom: 0.75rem;
  display: flex; align-items: center; gap: 0.5rem;
}
.denom-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.denom-toggles {
  display: flex; flex-wrap: wrap; gap: 0.5rem;
}
.denom-toggle {
  display: flex; align-items: center; gap: 0.4rem;
  padding: 0.4rem 0.75rem;
  border-radius: 50px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}
.denom-toggle:hover { border-color: #555; color: var(--text); }
.denom-toggle.active { border-color: var(--gold); color: var(--gold); background: var(--gold)11; }
.denom-toggle .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* === BATCH SECTION === */
.batch-section { margin-bottom: 2rem; }

.batch-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1rem;
}
.batch-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
}
.batch-title span { color: var(--gold); }

.btn {
  padding: 0.5rem 1rem;
  border-radius: 50px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s;
  display: flex; align-items: center; gap: 0.4rem;
}
.btn:hover { background: var(--surface2); border-color: #555; }
.btn.btn-gold {
  background: var(--gold)22;
  border-color: var(--gold)66;
  color: var(--gold);
}
.btn.btn-gold:hover { background: var(--gold)33; }
.btn.btn-green {
  background: var(--green)22;
  border-color: var(--green)66;
  color: var(--green);
}
.btn.btn-green:hover { background: var(--green)33; }

.batch-list { display: flex; flex-direction: column; gap: 0.5rem; }

.batch-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.75rem 1.25rem;
  display: flex; align-items: center; gap: 1rem;
  cursor: pointer;
  transition: all 0.2s;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateX(-12px); }
  to { opacity: 1; transform: translateX(0); }
}
.batch-item:hover { border-color: #444; }
.batch-item.current { border-color: var(--green)88; background: var(--green)08; }

.batch-num {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  color: var(--muted);
  width: 60px; flex-shrink: 0;
}
.batch-notes {
  flex: 1;
  font-family: 'DM Mono', monospace;
  font-size: 0.8rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.batch-notes .note-tag {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 0.7rem;
  margin-right: 4px;
  color: var(--text);
}
.batch-total {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  color: var(--gold);
  flex-shrink: 0;
}
.batch-delete {
  width: 28px; height: 28px;
  border-radius: 50%; border: none;
  background: transparent; color: var(--muted);
  cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; flex-shrink: 0;
}
.batch-delete:hover { background: #ff444422; color: #ff4444; }

/* === CURRENT BATCH PANEL === */
.current-panel {
  background: var(--surface);
  border: 1px solid var(--green)44;
  border-radius: 16px;
  padding: 1.5rem;
  margin-bottom: 2rem;
  position: relative;
  overflow: hidden;
}
.current-panel::before {
  content: 'CURRENT BATCH';
  position: absolute; top: 12px; right: 16px;
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  color: var(--green)88;
}
.current-total {
  font-family: 'Syne', sans-serif;
  font-size: 2.5rem;
  font-weight: 800;
  color: var(--green);
  margin-bottom: 0.5rem;
  transition: all 0.3s;
}
.current-breakdown {
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  color: var(--muted);
  line-height: 1.8;
}

/* === GRAND TOTAL === */
.grand-total-bar {
  background: var(--gold)11;
  border: 1px solid var(--gold)44;
  border-radius: 16px;
  padding: 1.5rem 2rem;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 2rem;
}
.gt-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--gold)aa;
}
.gt-value {
  font-family: 'Syne', sans-serif;
  font-size: 2.2rem;
  font-weight: 800;
  color: var(--gold);
}

/* === ACTION BAR === */
.action-bar {
  display: flex; gap: 0.75rem; flex-wrap: wrap;
  margin-bottom: 2rem;
}

/* === CONFETTI === */
#confetti-canvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 9999;
}

/* === TOAST === */
.toast {
  position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 0.6rem 1.5rem;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.85rem;
  color: var(--text);
  z-index: 9998;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.hidden { opacity: 0; }

/* === COIN ANIMATION === */
.coin-pop {
  position: fixed; z-index: 9997;
  font-size: 1.5rem; pointer-events: none;
  animation: coinFly 0.8s ease forwards;
}
@keyframes coinFly {
  0% { transform: translateY(0) scale(0); opacity: 1; }
  60% { transform: translateY(-60px) scale(1.2); opacity: 1; }
  100% { transform: translateY(-100px) scale(0.5); opacity: 0; }
}

/* === PRINT STYLES === */
@media print {
  body { background: white; color: black; }
  #bg-canvas, #confetti-canvas, .toast, .action-bar, .denom-section { display: none; }
  .print-only { display: block !important; }
  .no-print { display: none !important; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

.print-only { display: none; }

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
.pulse { animation: pulse 0.3s ease; }

/* === SECONDARY DENOM ROWS (hidden by default) === */
.secondary-notes {
  display: flex; flex-direction: column; gap: 0.75rem;
  margin-bottom: 1rem;
}
.note-row.hidden-denom {
  display: none;
}

/* number bump animation */
@keyframes bump {
  0% { transform: scale(1); }
  40% { transform: scale(1.15); color: var(--gold2); }
  100% { transform: scale(1); }
}
.bump { animation: bump 0.25s ease; }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="confetti-canvas"></canvas>
<div class="toast hidden" id="toast"></div>

<header>
  <div>
    <div class="logo">रुपया<span>.</span></div>
    <div class="logo-sub">Note Counter v2</div>
  </div>
  <div class="header-total">
    <div class="header-total-label">Grand Total</div>
    <div class="header-total-value" id="header-grand-total">₹0</div>
  </div>
</header>

<main>

  <!-- DENOMINATION TOGGLES -->
  <div class="denom-section">
    <div class="denom-header">All Denominations</div>
    <div class="denom-toggles" id="denom-toggles">
      <div class="denom-toggle active" data-denom="100" onclick="toggleDenom(this)"><span class="dot"></span>₹100</div>
      <div class="denom-toggle active" data-denom="200" onclick="toggleDenom(this)"><span class="dot"></span>₹200</div>
      <div class="denom-toggle active" data-denom="500" onclick="toggleDenom(this)"><span class="dot"></span>₹500</div>
      <div class="denom-toggle" data-denom="50" onclick="toggleDenom(this)"><span class="dot"></span>₹50</div>
      <div class="denom-toggle" data-denom="20" onclick="toggleDenom(this)"><span class="dot"></span>₹20</div>
      <div class="denom-toggle" data-denom="10" onclick="toggleDenom(this)"><span class="dot"></span>₹10</div>
      <div class="denom-toggle" data-denom="2" onclick="toggleDenom(this)"><span class="dot"></span>₹2</div>
      <div class="denom-toggle" data-denom="1" onclick="toggleDenom(this)"><span class="dot"></span>₹1</div>
    </div>
  </div>

  <!-- NOTE INPUT ROWS -->
  <div class="primary-notes" id="note-rows">
    <!-- rows generated by JS -->
  </div>

  <!-- CURRENT BATCH PANEL -->
  <div class="current-panel">
    <div class="current-total" id="current-total">₹0</div>
    <div class="current-breakdown" id="current-breakdown">No notes entered yet</div>
  </div>

  <!-- ACTION BAR -->
  <div class="action-bar no-print">
    <button class="btn btn-green" onclick="saveBatch()">＋ Save as Batch</button>
    <button class="btn" onclick="clearCurrent()">⌫ Clear Current</button>
    <button class="btn btn-gold" onclick="printCurrent()">🖨 Print Current</button>
    <button class="btn btn-gold" onclick="printAll()">🖨 Print All</button>
  </div>

  <!-- SAVED BATCHES -->
  <div class="batch-section" id="batch-section" style="display:none">
    <div class="batch-header">
      <div class="batch-title">Saved Batches <span id="batch-count-label"></span></div>
      <button class="btn" onclick="clearAllBatches()">🗑 Clear All Batches</button>
    </div>
    <div class="batch-list" id="batch-list"></div>
  </div>

  <!-- GRAND TOTAL BAR -->
  <div class="grand-total-bar">
    <div>
      <div class="gt-label">Grand Total (All Batches + Current)</div>
      <div style="font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--muted);margin-top:4px" id="gt-breakdown"></div>
    </div>
    <div class="gt-value" id="grand-total-display">₹0</div>
  </div>

</main>

<!-- PRINT TEMPLATE (hidden, used for printing) -->
<div class="print-only" id="print-area"></div>

<script>
// =================== DATA ====================
const DENOMS = [
  { v: 500, chip: 'chip-500', label: '500 rupee notes', key: 'd500' },
  { v: 200, chip: 'chip-200', label: '200 rupee notes', key: 'd200' },
  { v: 100, chip: 'chip-100', label: '100 rupee notes', key: 'd100' },
  { v: 50,  chip: 'chip-50',  label: '50 rupee notes',  key: 'd50'  },
  { v: 20,  chip: 'chip-20',  label: '20 rupee notes',  key: 'd20'  },
  { v: 10,  chip: 'chip-10',  label: '10 rupee notes',  key: 'd10'  },
  { v: 2,   chip: 'chip-2',   label: '2 rupee coins',   key: 'd2'   },
  { v: 1,   chip: 'chip-1',   label: '1 rupee coins',   key: 'd1'   },
];
const PRIMARY = [100, 200, 500];
let enabledDenoms = new Set([100, 200, 500]);
let batches = [];
let currentValues = {};
DENOMS.forEach(d => currentValues[d.v] = 0);

// =================== AUDIO ====================
const AC = window.AudioContext ? new AudioContext() : null;
function beep(freq=440, dur=0.08, vol=0.15, type='sine') {
  if (!AC) return;
  try {
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.start(); o.stop(AC.currentTime + dur);
  } catch(e){}
}
function playAdd() { beep(600,0.06,0.1,'sine'); setTimeout(()=>beep(800,0.06,0.08,'sine'),60); }
function playSave() {
  [400,500,650,800].forEach((f,i) => setTimeout(()=>beep(f,0.08,0.12,'sine'),i*60));
}
function playClear() { beep(300,0.1,0.1,'sawtooth'); }
function playPrint() { beep(880,0.05); setTimeout(()=>beep(1100,0.05),80); setTimeout(()=>beep(880,0.05),160); }

// =================== CONFETTI ====================
const confCanvas = document.getElementById('confetti-canvas');
const confCtx = confCanvas.getContext('2d');
let confParticles = [];
function resizeConf() {
  confCanvas.width = window.innerWidth;
  confCanvas.height = window.innerHeight;
}
resizeConf();
window.addEventListener('resize', resizeConf);

function launchConfetti(x, y, count=30) {
  const colors = ['#f0b429','#06d6a0','#118ab2','#ff6b9d','#ffd166','#7fff88'];
  for(let i=0;i<count;i++) {
    confParticles.push({
      x, y,
      vx: (Math.random()-0.5)*10,
      vy: -(Math.random()*8+4),
      color: colors[Math.floor(Math.random()*colors.length)],
      size: Math.random()*6+3,
      life: 1, rot: Math.random()*360,
      rotSpeed: (Math.random()-0.5)*10
    });
  }
  requestAnimationFrame(animConf);
}
function animConf() {
  confCtx.clearRect(0,0,confCanvas.width,confCanvas.height);
  confParticles = confParticles.filter(p => p.life > 0);
  confParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.3;
    p.life -= 0.018; p.rot += p.rotSpeed;
    confCtx.save();
    confCtx.globalAlpha = p.life;
    confCtx.translate(p.x, p.y);
    confCtx.rotate(p.rot * Math.PI/180);
    confCtx.fillStyle = p.color;
    confCtx.fillRect(-p.size/2, -p.size/2, p.size, p.size/2);
    confCtx.restore();
  });
  if(confParticles.length > 0) requestAnimationFrame(animConf);
}

// =================== BG PARTICLES ====================
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
let particles = [];
function resizeBg() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
}
resizeBg();
window.addEventListener('resize', resizeBg);

for(let i=0;i<30;i++) particles.push({
  x: Math.random()*window.innerWidth,
  y: Math.random()*window.innerHeight,
  r: Math.random()*2+0.5,
  vx: (Math.random()-0.5)*0.3,
  vy: (Math.random()-0.5)*0.3,
  color: ['#f0b42933','#06d6a022','#118ab222'][Math.floor(Math.random()*3)]
});

function animBg() {
  bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if(p.x<0||p.x>bgCanvas.width) p.vx*=-1;
    if(p.y<0||p.y>bgCanvas.height) p.vy*=-1;
    bgCtx.beginPath();
    bgCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
    bgCtx.fillStyle = p.color;
    bgCtx.fill();
  });
  requestAnimationFrame(animBg);
}
animBg();

// =================== TOAST ====================
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.add('hidden'), 2200);
}

// =================== COIN POP ====================
function coinPop(el) {
  const rect = el.getBoundingClientRect();
  const div = document.createElement('div');
  div.className = 'coin-pop';
  div.textContent = '💰';
  div.style.left = (rect.left + rect.width/2) + 'px';
  div.style.top = (rect.top + rect.height/2) + 'px';
  document.body.appendChild(div);
  setTimeout(()=>div.remove(), 900);
}

// =================== RENDER ROWS ====================
function renderRows() {
  const container = document.getElementById('note-rows');
  container.innerHTML = '';
  DENOMS.forEach(d => {
    if (!enabledDenoms.has(d.v)) return;
    const row = document.createElement('div');
    row.className = 'note-row' + (currentValues[d.v] > 0 ? ' active' : '');
    row.id = 'row-' + d.v;
    row.innerHTML = `
      <div class="note-chip ${d.chip}">${d.v}</div>
      <div class="note-label"><strong>₹${d.v}</strong>${d.label}</div>
      <div class="note-input-wrap">
        <input type="number" min="0" class="note-input" id="input-${d.v}"
          value="${currentValues[d.v] || ''}"
          placeholder="0"
          oninput="onInput(${d.v}, this)"
          onkeydown="handleKey(event, ${d.v})"
        >
      </div>
      <div class="note-multiplier">×</div>
      <div class="note-value ${currentValues[d.v] ? '' : 'zero'}" id="val-${d.v}">
        ${currentValues[d.v] ? '₹' + fmt(currentValues[d.v] * d.v) : '—'}
      </div>
    `;
    container.appendChild(row);
  });
}

function handleKey(e, denom) {
  if (e.key === 'Enter') {
    const idx = DENOMS.findIndex(d=>d.v===denom && enabledDenoms.has(d.v));
    const active = DENOMS.filter(d=>enabledDenoms.has(d.v));
    const next = active[idx+1];
    if(next) document.getElementById('input-'+next.v)?.focus();
  }
}

function onInput(denom, el) {
  if(AC && AC.state === 'suspended') AC.resume();
  const val = parseInt(el.value) || 0;
  currentValues[denom] = Math.max(0, val);
  const row = document.getElementById('row-' + denom);
  const valEl = document.getElementById('val-' + denom);
  const total = currentValues[denom] * denom;
  if (currentValues[denom] > 0) {
    row.classList.add('active');
    valEl.classList.remove('zero');
    valEl.textContent = '₹' + fmt(total);
    valEl.classList.remove('bump');
    requestAnimationFrame(()=>{ valEl.classList.add('bump'); });
    playAdd();
  } else {
    row.classList.remove('active');
    valEl.classList.add('zero');
    valEl.textContent = '—';
  }
  updateTotals();
}

function fmt(n) {
  return n.toLocaleString('en-IN');
}

// =================== TOTALS ====================
function getCurrentTotal() {
  return DENOMS.reduce((s, d) => s + (currentValues[d.v] || 0) * d.v, 0);
}
function getBatchesTotal() {
  return batches.reduce((s, b) => s + b.total, 0);
}
function getGrandTotal() {
  return getCurrentTotal() + getBatchesTotal();
}

function updateTotals() {
  const cur = getCurrentTotal();
  const gt = getGrandTotal();

  // current batch panel
  document.getElementById('current-total').textContent = '₹' + fmt(cur);
  const brkEl = document.getElementById('current-breakdown');
  const parts = DENOMS.filter(d=>enabledDenoms.has(d.v) && currentValues[d.v]>0)
    .map(d=>`${d.v}×${currentValues[d.v]} = ₹${fmt(d.v*currentValues[d.v])}`);
  brkEl.innerHTML = parts.length ? parts.join('<br>') : 'No notes entered yet';

  // grand total
  document.getElementById('grand-total-display').textContent = '₹' + fmt(gt);
  document.getElementById('header-grand-total').textContent = '₹' + fmt(gt);

  // gt breakdown
  const batchCount = batches.length;
  let gtBreak = '';
  if(batchCount>0) gtBreak += `${batchCount} batch${batchCount>1?'es':''}: ₹${fmt(getBatchesTotal())}  +  `;
  gtBreak += `current: ₹${fmt(cur)}`;
  document.getElementById('gt-breakdown').textContent = gtBreak;
}

// =================== DENOMINATION TOGGLES ====================
function toggleDenom(el) {
  if(AC && AC.state === 'suspended') AC.resume();
  const d = parseInt(el.dataset.denom);
  if(enabledDenoms.has(d)) {
    if(enabledDenoms.size <= 1) { showToast('Need at least one denomination!'); return; }
    enabledDenoms.delete(d);
    el.classList.remove('active');
    currentValues[d] = 0;
  } else {
    enabledDenoms.add(d);
    el.classList.add('active');
  }
  beep(enabledDenoms.has(d)?600:300, 0.07);
  renderRows();
  updateTotals();
}

// =================== BATCH MANAGEMENT ====================
function getBatchSnapshot() {
  return DENOMS
    .filter(d=>enabledDenoms.has(d.v) && currentValues[d.v]>0)
    .map(d=>({ v: d.v, count: currentValues[d.v], chip: d.chip }));
}

function saveBatch() {
  if(AC && AC.state === 'suspended') AC.resume();
  const total = getCurrentTotal();
  if(total === 0) { showToast('Nothing to save — enter some notes first!'); return; }
  const snap = getBatchSnapshot();
  const batch = {
    id: Date.now(),
    num: batches.length + 1,
    notes: snap,
    total
  };
  batches.push(batch);
  playSave();
  launchConfetti(window.innerWidth/2, window.innerHeight/2, 50);
  showToast(`Batch ${batch.num} saved — ₹${fmt(total)}`);
  clearCurrent(true);
  renderBatches();
  updateTotals();
}

function clearCurrent(silent=false) {
  if(AC && AC.state === 'suspended') AC.resume();
  DENOMS.forEach(d => currentValues[d.v] = 0);
  DENOMS.forEach(d => {
    const inp = document.getElementById('input-'+d.v);
    if(inp) inp.value = '';
    const row = document.getElementById('row-'+d.v);
    if(row) row.classList.remove('active');
    const val = document.getElementById('val-'+d.v);
    if(val) { val.classList.add('zero'); val.textContent = '—'; }
  });
  if(!silent) { playClear(); showToast('Current cleared'); }
  updateTotals();
}

function deleteBatch(id) {
  batches = batches.filter(b=>b.id!==id);
  batches.forEach((b,i)=>b.num=i+1);
  renderBatches();
  updateTotals();
  showToast('Batch removed');
  beep(300,0.1);
}

function clearAllBatches() {
  if(!batches.length) return;
  batches = [];
  renderBatches();
  updateTotals();
  playClear();
  showToast('All batches cleared');
}

function renderBatches() {
  const section = document.getElementById('batch-section');
  const list = document.getElementById('batch-list');
  if(!batches.length) { section.style.display='none'; return; }
  section.style.display='block';
  document.getElementById('batch-count-label').textContent = `(${batches.length})`;
  list.innerHTML = '';
  batches.forEach(b => {
    const item = document.createElement('div');
    item.className = 'batch-item';
    item.id = 'batch-' + b.id;
    const noteTags = b.notes.map(n =>
      `<span class="note-tag" style="background:${chipBg(n.v)};color:${chipFg(n.v)}">₹${n.v}×${n.count}</span>`
    ).join('');
    item.innerHTML = `
      <div class="batch-num">BATCH ${b.num}</div>
      <div class="batch-notes">${noteTags}</div>
      <div class="batch-total">₹${fmt(b.total)}</div>
      <button class="batch-delete" onclick="deleteBatch(${b.id})" title="Remove">×</button>
    `;
    list.appendChild(item);
  });
}

function chipBg(v) {
  const map={500:'#4a2a1a',200:'#1a2e4a',100:'#1a4a1e',50:'#3a1a4a',20:'#4a1a1a',10:'#1a3d4a',2:'#4a1a3a',1:'#2e1a0a'};
  return map[v]||'#222';
}
function chipFg(v) {
  const map={500:'#ffb87f',200:'#7fbfff',100:'#7fff88',50:'#df9fff',20:'#ff9f9f',10:'#7fefff',2:'#ff9fdf',1:'#ffd7a0'};
  return map[v]||'#fff';
}

// =================== PRINT ====================
function buildPrintHTML(mode) {
  // mode: 'current' | 'all'
  const styles = `
    <style>
      body { font-family: 'Courier New', monospace; max-width: 420px; margin: 0 auto; padding: 20px; }
      h1 { font-size: 18px; text-align: center; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 16px; }
      h2 { font-size: 13px; margin: 16px 0 8px; background: #000; color: #fff; padding: 4px 8px; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 12px; }
      td, th { padding: 4px 8px; border-bottom: 1px solid #ccc; }
      th { font-weight: bold; text-align: left; }
      td:last-child, th:last-child { text-align: right; }
      .subtotal { font-weight: bold; border-top: 2px solid #000; font-size: 13px; }
      .grand { font-size: 15px; font-weight: bold; background: #000; color: #fff; padding: 8px; text-align: right; margin-top: 16px; }
      .meta { font-size: 10px; color: #888; text-align: center; margin-top: 16px; }
    </style>
  `;

  const noteRow = (v, count) =>
    `<tr><td>₹${v}</td><td>${count} notes</td><td>₹${fmt(v*count)}</td></tr>`;

  let body = '';
  const now = new Date().toLocaleString('en-IN');

  if(mode === 'current') {
    const cur = getCurrentTotal();
    const snap = getBatchSnapshot();
    body = `<h1>रुपया — Current Batch</h1>`;
    body += `<table><tr><th>Denom</th><th>Count</th><th>Value</th></tr>`;
    snap.forEach(n => body += noteRow(n.v, n.count));
    body += `<tr class="subtotal"><td colspan="2">Total</td><td>₹${fmt(cur)}</td></tr></table>`;
  } else {
    // all batches + current + grand total
    body = `<h1>रुपया — Full Report</h1>`;

    if(batches.length) {
      body += `<h2>Previous Batches</h2>`;
      batches.forEach(b => {
        body += `<h2 style="background:#444">Batch ${b.num}</h2>`;
        body += `<table><tr><th>Denom</th><th>Count</th><th>Value</th></tr>`;
        b.notes.forEach(n => body += noteRow(n.v, n.count));
        body += `<tr class="subtotal"><td colspan="2">Batch ${b.num} Total</td><td>₹${fmt(b.total)}</td></tr></table>`;
      });
      body += `<table><tr class="subtotal"><td colspan="2">All Batches Subtotal</td><td>₹${fmt(getBatchesTotal())}</td></tr></table>`;
    }

    const curTotal = getCurrentTotal();
    const curSnap = getBatchSnapshot();
    if(curTotal > 0) {
      body += `<h2>Current Batch (Latest)</h2>`;
      body += `<table><tr><th>Denom</th><th>Count</th><th>Value</th></tr>`;
      curSnap.forEach(n => body += noteRow(n.v, n.count));
      body += `<tr class="subtotal"><td colspan="2">Current Total</td><td>₹${fmt(curTotal)}</td></tr></table>`;
    }

    body += `<div class="grand">GRAND TOTAL: ₹${fmt(getGrandTotal())}</div>`;
  }

  body += `<div class="meta">Printed on ${now} · रुपया Note Counter</div>`;
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Print</title>${styles}</head><body>${body}</body></html>`;
}

function printCurrent() {
  if(AC && AC.state === 'suspended') AC.resume();
  if(getCurrentTotal() === 0) { showToast('Nothing to print!'); return; }
  playPrint();
  const w = window.open('','_blank','width=480,height=600');
  w.document.write(buildPrintHTML('current'));
  w.document.close();
  setTimeout(()=>{ w.focus(); w.print(); }, 400);
}

function printAll() {
  if(AC && AC.state === 'suspended') AC.resume();
  if(getGrandTotal() === 0) { showToast('Nothing to print!'); return; }
  playPrint();
  const w = window.open('','_blank','width=480,height=700');
  w.document.write(buildPrintHTML('all'));
  w.document.close();
  setTimeout(()=>{ w.focus(); w.print(); }, 400);
}

// =================== INIT ====================
renderRows();
updateTotals();

// Wake AudioContext on first user gesture
document.addEventListener('click', ()=>{ if(AC&&AC.state==='suspended') AC.resume(); }, {once:true});
</script>
</body>
</html>
