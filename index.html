<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Counter Thermal Printer</title>

<style>

body{
    margin:0;
    padding:0;
    background:#111827;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:12px;
}

.card{
    background:#1f2937;
    border-radius:12px;
    padding:12px;
    text-align:center;
}

.card h2{
    margin:0 0 10px;
}

input{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    text-align:center;
    font-size:22px;
    font-weight:900;
}

.subtotal{
    margin-top:10px;
    font-size:20px;
    font-weight:900;
    color:#10b981;
}

.totalBox{
    background:#000;
    color:#fff;
    padding:20px;
    border-radius:12px;
    margin-top:20px;
    text-align:center;
}

.totalBox h2{
    margin:0;
    font-size:22px;
}

.total{
    font-size:42px;
    font-weight:900;
    margin-top:10px;
}

button{
    width:100%;
    height:58px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    font-size:20px;
    font-weight:900;
    cursor:pointer;
}

.addBtn{
    background:#10b981;
    color:white;
}

.printBtn{
    background:#2563eb;
    color:white;
}

.resetBtn{
    background:#ef4444;
    color:white;
}

/* ========================= */
/* PRINT AREA */
/* ========================= */

#printSection{
    display:none;
}

/* ========================= */
/* THERMAL PRINT */
/* ========================= */

@media print{

    html,body{
        width:80mm;
        margin:0 !important;
        padding:0 !important;
        background:#fff !important;
    }

    body *{
        visibility:hidden;
    }

    #printSection,
    #printSection *{
        visibility:visible;
    }

    #printSection{

        display:block !important;

        position:absolute;
        left:0;
        top:0;

        width:76mm;
        max-width:76mm;

        padding:3mm;

        color:#000;
        background:#fff;

        font-family:Arial,sans-serif;

        overflow:hidden;
    }

    .shop{
        text-align:center;
        font-size:30px;
        font-weight:900;
        margin-bottom:10px;
    }

    .title{
        text-align:center;
        font-size:22px;
        font-weight:900;
        margin-bottom:10px;
    }

    .date{
        text-align:center;
        font-size:16px;
        font-weight:700;
        margin-bottom:15px;
    }

    .sectionTitle{

        background:#000;
        color:#fff;

        text-align:center;

        padding:10px;

        font-size:22px;
        font-weight:900;

        margin-top:15px;
        margin-bottom:10px;
    }

    table{
        width:100%;
        border-collapse:collapse;
        margin-bottom:10px;
    }

    th{
        border-bottom:3px solid #000;
        padding:10px 4px;
        font-size:18px;
        font-weight:900;
    }

    td{
        border-bottom:2px solid #aaa;
        padding:10px 4px;
        font-size:18px;
        font-weight:800;
    }

    .sectionTotal{

        text-align:right;

        font-size:24px;
        font-weight:900;

        margin-top:10px;
        margin-bottom:15px;
    }

    .grandTotal{

        background:#000;
        color:#fff;

        text-align:center;

        padding:15px;

        font-size:30px;
        font-weight:900;

        margin-top:15px;
    }

    .footer{
        text-align:center;
        margin-top:20px;
        font-size:15px;
        font-weight:700;
    }

    @page{
        size:80mm auto;
        margin:0;
    }
}

</style>
</head>

<body>

<div class="container">

<h1>₹ Cash Counter</h1>

<div class="grid" id="grid"></div>

<div class="totalBox">

<h2>Running Total</h2>

<div class="total" id="runningTotal">
₹0
</div>

</div>

<button class="addBtn" onclick="addTotal()">
ADD TO TOTAL
</button>

<button class="printBtn" onclick="printReport()">
PRINT THERMAL REPORT
</button>

<button class="resetBtn" onclick="resetAll()">
RESET
</button>

</div>

<!-- ========================= -->
<!-- PRINT SECTION -->
<!-- ========================= -->

<div id="printSection">

<div class="shop">
₹ CASH LEDGER
</div>

<div class="title">
THERMAL REPORT
</div>

<div class="date" id="printDate"></div>

<!-- OLD NOTES -->

<div class="sectionTitle">
OLD NOTES
</div>

<table>

<thead>
<tr>
<th>NOTE</th>
<th>QTY</th>
<th>AMOUNT</th>
</tr>
</thead>

<tbody id="oldBody"></tbody>

</table>

<div class="sectionTotal" id="oldTotal"></div>

<!-- NEW NOTES -->

<div class="sectionTitle">
NEW NOTES
</div>

<table>

<thead>
<tr>
<th>NOTE</th>
<th>QTY</th>
<th>AMOUNT</th>
</tr>
</thead>

<tbody id="newBody"></tbody>

</table>

<div class="sectionTotal" id="newTotal"></div>

<div class="grandTotal" id="grandTotalPrint"></div>

<div class="footer">
Cash Counter Ledger<br>
Thank You
</div>

</div>

<script>

const oldNotes = [10,20,50];
const newNotes = [100,200,500];

const allNotes = [...oldNotes,...newNotes];

let runningTotal = 0;

const grid = document.getElementById("grid");

allNotes.forEach(note=>{

    grid.innerHTML += `

    <div class="card">

        <h2>₹${note}</h2>

        <input
            type="number"
            id="note${note}"
            min="0"
            value=""
            oninput="updateSubtotal(${note})"
        >

        <div class="subtotal" id="subtotal${note}">
            ₹0
        </div>

    </div>

    `;

});

function updateSubtotal(note){

    let qty =
        Number(document.getElementById("note"+note).value || 0);

    let subtotal = qty * note;

    document.getElementById("subtotal"+note).innerText =
        "₹" + subtotal.toLocaleString();

}

function addTotal(){

    let total = 0;

    allNotes.forEach(note=>{

        let qty =
            Number(document.getElementById("note"+note).value || 0);

        total += qty * note;

    });

    runningTotal += total;

    document.getElementById("runningTotal").innerText =
        "₹" + runningTotal.toLocaleString();

    alert("₹" + total.toLocaleString() + " Added");

}

function resetAll(){

    allNotes.forEach(note=>{

        document.getElementById("note"+note).value = "";

        document.getElementById("subtotal"+note).innerText =
            "₹0";

    });

}

function buildRows(noteArray){

    let html = "";
    let total = 0;

    noteArray.forEach(note=>{

        let qty =
            Number(document.getElementById("note"+note).value || 0);

        let amount = qty * note;

        if(qty > 0){

            html += `
            <tr>
                <td>₹${note}</td>
                <td>${qty}</td>
                <td>₹${amount.toLocaleString()}</td>
            </tr>
            `;

            total += amount;

        }

    });

    return {
        html,
        total
    };

}

function printReport(){

    let oldData = buildRows(oldNotes);

    let newData = buildRows(newNotes);

    document.getElementById("oldBody").innerHTML =
        oldData.html;

    document.getElementById("newBody").innerHTML =
        newData.html;

    document.getElementById("oldTotal").innerHTML =
        "OLD TOTAL ₹" + oldData.total.toLocaleString();

    document.getElementById("newTotal").innerHTML =
        "NEW TOTAL ₹" + newData.total.toLocaleString();

    let grand =
        oldData.total + newData.total;

    document.getElementById("grandTotalPrint").innerHTML =
        "GRAND TOTAL ₹" + grand.toLocaleString();

    let today = new Date();

    document.getElementById("printDate").innerHTML =
        "DATE RANGE : " +
        today.toLocaleDateString();

    document.getElementById("printSection").style.display =
        "block";

    window.print();

}

</script>

</body>
</html>
```
