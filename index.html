<body>

<div class="container">

<h1>₹ Cash Counter Ledger</h1>

<div class="grid" id="grid"></div>

<div class="totalBox">
    <h2>Running Total</h2>
    <div class="total" id="grandTotal">₹0</div>
</div>

<button class="addBtn" onclick="addTotal()">ADD TO TOTAL</button>

<button class="printBtn" onclick="printReport()">PRINT THERMAL REPORT</button>

<button class="resetBtn" onclick="resetAll()">RESET</button>

</div>

<div class="report hidden" id="report">

<div class="shop">₹ CASH LEDGER</div>

<div class="title">THERMAL REPORT</div>

<div class="date" id="reportDate"></div>

<table>
<thead>
<tr>
<th>NOTE</th>
<th>QTY</th>
<th>AMOUNT</th>
</tr>
</thead>

<tbody id="reportBody"></tbody>

</table>

<div class="grand" id="reportGrand"></div>

<div class="footer">
Cash Counter Ledger<br>
Thank You
</div>

</div>

<script>

const notes = [10,20,50,100,200,500];

let runningTotal = 0;

const grid = document.getElementById("grid");

notes.forEach(note=>{

    grid.innerHTML += `
    
    <div class="card">

        <h2>₹${note}</h2>

        <input 
            type="number"
            id="note${note}"
            min="0"
            value=""
            oninput="updateSubtotal(${note})"
        >

        <div class="subtotal" id="subtotal${note}">
            ₹0
        </div>

    </div>
    
    `;

});

function updateSubtotal(note){

    let qty = Number(document.getElementById("note"+note).value || 0);

    let subtotal = qty * note;

    document.getElementById("subtotal"+note).innerText =
        "₹" + subtotal.toLocaleString();

}

function addTotal(){

    let total = 0;

    notes.forEach(note=>{

        let qty = Number(document.getElementById("note"+note).value || 0);

        total += qty * note;

    });

    runningTotal += total;

    document.getElementById("grandTotal").innerText =
        "₹" + runningTotal.toLocaleString();

    alert("₹" + total.toLocaleString() + " Added");

}

function resetAll(){

    notes.forEach(note=>{

        document.getElementById("note"+note).value = "";

        document.getElementById("subtotal"+note).innerText = "₹0";

    });

}

function printReport(){

    let tbody = "";

    let total = 0;

    notes.forEach(note=>{

        let qty = Number(document.getElementById("note"+note).value || 0);

        let amount = qty * note;

        if(qty > 0){

            tbody += `
            <tr>
                <td>₹${note}</td>
                <td>${qty}</td>
                <td>₹${amount.toLocaleString()}</td>
            </tr>
            `;

            total += amount;

        }

    });

    document.getElementById("reportBody").innerHTML = tbody;

    let today = new Date();

    document.getElementById("reportDate").innerHTML =
        "DATE RANGE: " +
        today.toLocaleDateString();

    document.getElementById("reportGrand").innerHTML =
        "TOTAL ₹" + total.toLocaleString();

    document.getElementById("report").classList.remove("hidden");

    window.print();

}

</script>

</body>
</html>
